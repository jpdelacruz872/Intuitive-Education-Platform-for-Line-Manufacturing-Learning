<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div id="main_menu">
        <nav>
            <a href="{{ url_for('home') }}">
                <button type="button">Home</button>
            </a>
            <a href="{{ url_for('login') }}">
                <button type="button">Log in</button>
            </a>

            <button type="button">Create flow chart</button>

            <a href="{{ url_for('chatbot') }}">
                <button type="button" id="chatbot_btn">Chat bot</button>
            </a>

            <a href="{{ url_for('simulator') }}">
                <button type="button" id="simulator_btn">Simulator</button>
            </a>
        </nav>
    </div>

    <main class="chatbot_page">
        <section class="chatbot_panel">
            <h1>Robot Command Chatbot</h1>

            <p>
                Write a robotics question or a robot command. If your prompt asks
                for Webots control code, the system will generate a downloadable
                Python controller file.
            </p>

            <textarea id="prompt_input" placeholder="Input a prompt"></textarea>

            <div class="chatbot_actions">
                <button type="button" id="send_button" class="secondary_btn">Send</button>
                <button type="button" id="download_py" class="secondary_btn">Download .py</button>
            </div>

            <div class="answer_box">
                <p id="gemini_answer">Answer will appear here.</p>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
