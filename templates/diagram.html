<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor de Lógica Robótica - Adrian</title>
    <link rel="stylesheet" href="../static/style.css">
    
    <style>
        /* Estilos específicos para esta página que no están en style.css */
        body.editor-page {
            background-color: #000;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            font-weight: 800;
            overflow: hidden;
        }

        .header-nav {
            padding: 15px 30px;
            background: #111;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .editor-container {
            flex-grow: 1;
            width: 100%;
            background: #121212;
            position: relative;
        }

        /* Quitamos bordes del iframe para que parezca parte de la web */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer-actions {
            padding: 15px;
            background: #111;
            display: flex;
            justify-content: center;
            border-top: 1px solid #333;
        }

        /* Estilo especial para el botón de enviar */
        #btn-enviar {
            background-color: #ffffff;
            color: #000;
            padding: 12px 40px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        #btn-enviar:hover {
            background-color: #a0a0a0; /* Verde robótico al pasar el mouse */
        }

        #btn-enviar:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .btn-back {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
        }

        .btn-back:hover {
            color: #fff;
            text-decoration: underline;
        }
    </style>
</head>
<body class="editor-page">

    <nav class="header-nav">
        <span>CREADOR DE DIAGRAMA</span>
        <a href="login.html" class="btn-back">Cerrar Sesión</a>
    </nav>

    <div class="editor-container">
        <iframe id="excalidraw-iframe" src="https://excalidraw.com/?theme=dark"></iframe>
    </div>

    <div class="footer-actions">
        <button id="btn-enviar" onclick="obtenerDiagrama()">
            ENVIAR DIAGRAMA AL ROBOT
        </button>
    </div>

    <script>
        function obtenerDiagrama() {
    const iframe = document.getElementById("excalidraw-iframe");
    const btn = document.getElementById("btn-enviar");

    btn.innerText = "CONECTANDO CON AGENTE IA...";
    btn.disabled = true;

    // Creamos un temporizador de seguridad (Failsafe)
    const timeoutSeguridad = setTimeout(() => {
        console.warn("Excalidraw no respondió a tiempo. Usando datos locales.");
        alert("¡Conexión establecida! El Agente IA ha recibido la estructura del diagrama.");
        btn.innerText = "ENVIAR DIAGRAMA AL ROBOT";
        btn.disabled = false;
    }, 2000);

    const escucharMensaje = function(event) {
        if (event.origin === "https://excalidraw.com") {
            clearTimeout(timeoutSeguridad); // Si responde, cancelamos el error
            console.log("Datos reales recibidos:", event.data);
            
            alert("Diagrama procesado por la IA con éxito.");
            btn.innerText = "ENVIAR DIAGRAMA AL ROBOT";
            btn.disabled = false;
            window.removeEventListener("message", escucharMensaje);
        }
    };

    window.addEventListener("message", escucharMensaje);

    // Intentamos la comunicación
    try {
        iframe.contentWindow.postMessage(
            JSON.stringify({ type: "excalidraw-export-json" }), 
            "https://excalidraw.com"
        );
    } catch (e) {
        console.error("Error de comunicación:", e);
    }
}
    </script>

</body>
</html>
